spring.application.name=api-propiedad-horizontal

# Carga secretos locales desde .env (ignorado por git). Las variables de entorno reales tienen prioridad.
spring.config.import=optional:file:.env[.properties]

# --- Persistencia ---
# Los datos de conexion los aporta compose.yaml (spring-boot-docker-compose) en desarrollo.
# En produccion defina spring.datasource.* por variables de entorno.
# 'update' es solo para desarrollo: en produccion use 'validate' con migraciones (Flyway/Liquibase).
# El esquema lo crean y cambian las migraciones de Flyway (src/main/resources/db/migration); Hibernate solo valida
# que las entidades coincidan con la base. Un cambio de entidad sin su migracion hace fallar el arranque.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
# Adopta una base que ya tenia tablas pero ningun historial de Flyway (p. ej. creada antes con ddl-auto=update):
# la marca como version 1 sin volver a crear nada. En una base vacia aplica V1 normalmente.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false

# --- JWT (la app es stateless: nada de sesion en el servidor) ---
# El secreto es OBLIGATORIO (>= 32 caracteres) y se lee del entorno. Si falta, la app no arranca.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiracion=60m
app.security.jwt.emisor=api-propiedad-horizontal

# Vigencia del enlace de restablecer contrasena (token de un solo proposito, emisor distinto al de acceso)
app.security.jwt.expiracion-restablecimiento=30m

# --- Correo (SMTP). Sin MAIL_HOST la app arranca y simplemente no envia correos (queda un aviso en el log). ---
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Alternativa al SMTP por API HTTP de Brevo (para hosts que bloquean el SMTP saliente, como Render gratis).
# Con BREVO_API_KEY definida se usa Brevo en lugar de SMTP; el remitente debe estar verificado en Brevo.
app.mail.brevo.api-key=${BREVO_API_KEY:}
app.mail.brevo.url=https://api.brevo.com/v3/smtp/email
# Direccion "De:"; si esta vacia se usa MAIL_USERNAME.
app.mail.remitente=${MAIL_REMITENTE:}
# Pagina del front a la que lleva el enlace del correo (se le agrega ?token=...).
app.frontend.url-restablecer=${FRONTEND_URL_RESTABLECER:http://localhost:3000/restablecer-contrasena}

# --- Administrador inicial (opcional, solo se crea si no existe ningun administrador) ---
app.bootstrap.admin.correo=${BOOTSTRAP_ADMIN_CORREO:}
app.bootstrap.admin.contrasena=${BOOTSTRAP_ADMIN_CONTRASENA:}
