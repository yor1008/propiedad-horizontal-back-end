spring.application.name=api-propiedad-horizontal

# Carga secretos locales desde .env (ignorado por git). Las variables de entorno reales tienen prioridad.
spring.config.import=optional:file:.env[.properties]

# --- Persistencia ---
# Los datos de conexion los aporta compose.yaml (spring-boot-docker-compose) en desarrollo.
# En produccion defina spring.datasource.* por variables de entorno.
# 'update' es solo para desarrollo: en produccion use 'validate' con migraciones (Flyway/Liquibase).
# El esquema lo crean y cambian las migraciones de Flyway (src/main/resources/db/migration); Hibernate solo valida
# que las entidades coincidan con la base. Un cambio de entidad sin su migracion hace fallar el arranque.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
# Adopta una base que ya tenia tablas pero ningun historial de Flyway (p. ej. creada antes con ddl-auto=update):
# la marca como version 1 sin volver a crear nada. En una base vacia aplica V1 normalmente.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false

# --- JWT (la app es stateless: nada de sesion en el servidor) ---
# El secreto es OBLIGATORIO (>= 32 caracteres) y se lee del entorno. Si falta, la app no arranca.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiracion=60m
app.security.jwt.emisor=api-propiedad-horizontal

# --- Administrador inicial (opcional, solo se crea si no existe ningun administrador) ---
app.bootstrap.admin.correo=${BOOTSTRAP_ADMIN_CORREO:}
app.bootstrap.admin.contrasena=${BOOTSTRAP_ADMIN_CONTRASENA:}
