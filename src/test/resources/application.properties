spring.application.name=api-propiedad-horizontal

# Pruebas: H2 en memoria (modo PostgreSQL), esquema generado desde las entidades.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Las pruebas usan H2 y dejan que Hibernate cree el esquema; las migraciones (SQL de PostgreSQL) se verifican aparte.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.docker.compose.enabled=false

app.security.jwt.secret=secreto-solo-para-pruebas-0123456789-abcdef
app.security.jwt.expiracion=5m
app.security.jwt.emisor=api-propiedad-horizontal-test

app.bootstrap.admin.correo=
app.bootstrap.admin.contrasena=
