name: CI

# Solo integracion continua: el despliegue lo hace Render solo, al detectar el ultimo commit de main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Las pruebas usan H2 en memoria: no necesitan Postgres ni secretos.
      - run: chmod +x mvnw && ./mvnw -B test

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # Solo verifica que el Dockerfile compila; no publica la imagen.
      - run: docker build -t api-propiedad-horizontal:ci .
